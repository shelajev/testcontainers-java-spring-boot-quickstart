name: Gradle CI Build

on:
  push:
    branches:
      - '**'
jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Setup Java 17
        uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v3
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Testcontainers Cloud Client
        uses: atomicjar/testcontainers-cloud-setup-action@7d1bab3fdfe0027c91936deca6b924d8a8a7a04d # v1
        with:
          token: ${{ secrets.TC_CLOUD_TOKEN }}

      - name: Build with Gradle
        run: ./gradlew build

